# Builds Cairn on GitHub's servers.
#  - Every push to main builds and tests it and keeps the exe as a downloadable artifact on the run.
#  - When the version in src/win/main.cpp (kVersion) has no Release yet, a Release "v<version>" is
#    created automatically with the exe (zipped, and bare) attached. So: bump the version, push to
#    main, and the download appears on the Releases page.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 zip

      - name: Core tests (native)
        run: make test

      - name: Build Windows exe
        run: make

      - name: Package
        run: |
          ver=$(sed -n 's/.*kVersion = "\([0-9.]*\)".*/\1/p' src/win/main.cpp | head -1)
          test -n "$ver"
          echo "VER=$ver" >> "$GITHUB_ENV"
          mkdir -p dist/cairn
          cp build/cairn.exe README.md DEVLOG.md LICENSE dist/cairn/
          (cd dist && zip -qr "cairn-${ver}-windows-x64.zip" cairn)
          echo "ZIP=dist/cairn-${ver}-windows-x64.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: cairn-windows-x64
          path: ${{ env.ZIP }}

      - name: Publish release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Release v${VER} already exists; nothing to publish."
          else
            gh release create "v${VER}" "$ZIP" build/cairn.exe \
              --target "$GITHUB_SHA" \
              --title "Cairn ${VER}" \
              --notes "A for-fun software experiment, not a product. Windows x64; the zip holds the single static exe (cairn.exe alone is attached too). Built by GitHub Actions from this commit. See DEVLOG.md for what was and was not tested (mostly Wine, so far)."
          fi
